<!DOCTYPE html>
<!-- Library page markup for the Charlie MJ Reader extension. -->
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   My Reading Library
  </title>
  <link href="library.css" rel="stylesheet"/>
 </head>
 <body>
  <aside class="sidebar">
   <div class="brand">
    <img class="library-brand-logo" src="../../assets/logo.svg" alt="Charlie MJ Reader logo">
    <span>
     My Reading Library
    </span>
   </div>
   <nav id="side-nav">
    <button class="active" data-view="websites">
     🌐 Websites
    </button>
    <button data-view="news">
     📰 Newspapers / News
    </button>
    <button data-view="profiles">
     ◉ Profile Pages
    </button>
    <button data-view="favorites">
     &starf; Favorite
    </button>
    <button data-view="categories">
     ▦ Category
    </button>
    <button data-view="tags">
     # Tags
    </button>
    <button data-view="saved">
     🔖 Saved Articles
    </button>
    <button data-view="bookmarks">
     ☆ Bookmarks
    </button>
    <button data-view="learning-language">
     ✦ Learning Language
    </button>
    <button data-view="recent">
     ◷ Recent
    </button>
    <button data-view="all">
     ☰ All Saved
    </button>
   </nav>
   <div class="side-bottom">
    <button id="open-options">
     ⚙ General Settings
    </button>
    <button id="open-adapters">
     🧩 Compatibility Adapters
    </button>
   </div>
  </aside>
  <main class="workspace">
   <header>
    <div>
     <span class="eyebrow">
      CHARLIE MJ READER
     </span>
     <h1>
      My Reading Library
     </h1>
     <p>
      Websites, newspapers, writer profiles, logos, categories, SEO and complete fetched data.
     </p>
    </div>
    <div class="top-actions">
     <button class="primary-sm" id="add">
      ＋ Add current website
     </button>
     <button id="add-url-btn">
      Add by address
     </button>
     <button id="reload-library" title="Re-read saved data from storage and update this tab">
      <span class="spin" aria-hidden="true">↻</span> Refresh
     </button>
     <button id="refresh" title="Fetch the latest details from each website">
      Update website data
     </button>
     <button id="import">
      Import
     </button>
     <button id="export">
      Export
     </button>
    </div>
   </header>
   <section class="searchbar">
    <input autocomplete="off" id="search" placeholder="Search websites, newspapers, categories, tags, profiles and saved data&hellip;"/>
    <div class="hints" id="hints">
    </div>
   </section>
   <section class="status" id="view-status" role="status">
   </section>
   <section id="library-view">
   </section>
  </main>
  <input accept=".json,application/json" hidden="" id="file" type="file"/>
  <dialog id="add-dialog">
   <form id="add-form">
    <h3>
     Add to your library
    </h3>
    <p class="meta">
     Paste a website, newspaper or profile address. Category, logo and details are detected automatically.
    </p>
    <input autocomplete="off" id="add-url" placeholder="https://example.com  &middot;  or  https://medium.com/@username" required=""/>
    <div class="row">
     <label>
      Type
      <select id="add-kind">
       <option value="auto">
        Auto-detect
       </option>
       <option value="site">
        Website / blog
       </option>
       <option value="news">
        Newspaper / news
       </option>
       <option value="profile">
        Writer profile
       </option>
       <option value="learning-language">
        Learning Language Article
       </option>
      </select>
     </label>
     <button id="add-tab" type="button">
      Use my last open tab
     </button>
    </div>
    <div class="row">
     <label>
      Website category
      <select id="add-category">
       <option value="" selected>Auto-detect</option><option>General</option><option>Education</option><option>Tech</option>
       <option>Health</option><option>Science</option><option>Business</option>
       <option>Lifestyle</option><option>News</option><option>Other</option>
      </select>
     </label>
     <label>
      Learning language
      <select id="add-language">
       <option value="en">English</option><option value="ur">Urdu</option>
       <option value="de">German</option><option value="fr">French</option>
       <option value="es">Spanish</option><option value="ar">Arabic</option>
       <option value="tr">Turkish</option><option value="other">Other / enter below</option>
      </select>
     </label>
    </div>
    <label class="learning-site-option">
     <input id="add-learning-site" type="checkbox">
     Mark this as a language-learning website
    </label>
    <input id="add-language-custom" placeholder="Custom language name (optional)" autocomplete="off">
    <div class="note" id="add-msg">
    </div>
    <div class="row end">
     <button id="add-cancel" type="button">
      Cancel
     </button>
     <button class="primary-sm" type="submit">
      Add
     </button>
    </div>
   </form>
  </dialog>
  <dialog id="detail">
   <div class="d-top">
    <div class="d-head" id="detail-head">
    </div>
    <button aria-label="Close" class="btn" id="detail-close">
     ✕
    </button>
   </div>
   <div class="d-tabs" id="detail-tabs">
   </div>
   <div class="d-body" id="detail-body">
   </div>
  </dialog>
  <script src="library.js" type="module">
  </script>
 </body>
</html>
