<!DOCTYPE html>
<!-- Options page markup for the Charlie MJ Reader extension. -->
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Charlie MJ Reader Settings
  </title>
  <link href="options.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="wrap">
   <header>
    <div>
     <span class="eyebrow">
      CHARLIE MJ READER
     </span>
     <h1>
      Settings &amp; preferences
     </h1>
     <p>
      Make your reading workspace feel like yours.
     </p>
    </div>
    <a href="../reader/reader.html">
     Open workspace &nearrow;
    </a>
    &middot;
    <a href="../language-learning/language-learning.html">
     Language Learning &nearrow;
    </a>
   </header>
   <div class="layout">
    <nav id="tabs">
     <button class="active" data-tab="general">
      General
     </button>
     <button data-tab="appearance">
      Appearance &amp; Themes
     </button>
     <button data-tab="toolbar">
      Toolbars
     </button>
     <button data-tab="websites">
      Supported Websites
     </button>
     <button data-tab="library">
      My Reading Library
     </button>
     <button data-tab="reading">
      Reading Preferences
     </button>
     <button data-tab="highlight">
      Highlight Preferences
     </button>
     <button data-tab="tts">
      Text-to-Speech
     </button>
     <button data-tab="smartAudio">
      Smart Audio Reader
     </button>
     <button data-tab="vocabulary">
      Vocabulary
     </button>
     <button data-tab="languageLearning">
      Language Learning Mode
     </button>
     <button data-tab="ai">
      AI Configuration
     </button>
     <button data-tab="notifications">
      Notifications
     </button>
     <button data-tab="storage">
      Storage &amp; Backup
     </button>
     <button data-tab="privacy">
      Privacy &amp; Permissions
     </button>
     <button data-tab="medium">
      Medium Compatibility
     </button>
     <button data-tab="intelligence">
      Extension Intelligence
     </button>
     <button data-tab="topics">
      Topics &amp; Knowledge
     </button>
     <button data-tab="focus">
      Focus
     </button>
     <button data-tab="productivity">
      Productivity
     </button>
     <button data-tab="performance">
      Performance
     </button>
     <button data-tab="database">
      Database
     </button>
     <button data-tab="sync">
      GitHub Data Sync
     </button>
    </nav>
    <section id="panel">
    </section>
   </div>
   <div id="saved" role="status">
   </div>
  </main>
  <script src="../lib/site-gate.js">
  </script>
  <script src="options.js" type="module">
  </script>
 </body>
</html>
